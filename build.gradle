plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
    id 'com.diffplug.spotless' version '8.10.1'
    id "com.peterabeles.gversion" version "1.11.0"
    id "io.freefair.lombok" version "9.5.0"
    id "com.github.spotbugs" version "6.5.11"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                    /*
                     * Serial is the right collector for a two-core roboRIO: no concurrent GC
                     * threads competing with the robot loop. It ignores the pause-time and
                     * time-ratio hints (-XX:MaxGCPauseMillis, -XX:GCTimeRatio), which used to be
                     * set here and read like protection that was not there. What actually bounds
                     * the pauses is Robot.disabledInit()/disabledPeriodic() running a full
                     * collection while the robot is disabled, so old gen is empty at enable.
                     */
                    jvmArgs.add("-XX:+UseSerialGC")

                    final MAX_JAVA_HEAP_SIZE_MB = 100;
                    jvmArgs.add("-Xmx" + MAX_JAVA_HEAP_SIZE_MB + "M")
                    jvmArgs.add("-Xms" + MAX_JAVA_HEAP_SIZE_MB + "M")
                    jvmArgs.add("-XX:+AlwaysPreTouch")

                    jvmArgs.add("-XX:+HeapDumpOnOutOfMemoryError")
                    jvmArgs.add("-XX:HeapDumpPath=/u/frc-usercode.hprof")

                    /*
                     * GC log, to settle where the long loop stalls come from.
                     *
                     * Every 2026-09-05 log has at least one loop over 500 ms and three have one
                     * over 900 ms, topping out at 1302 ms. The Driver Station calls comms lost
                     * after about a second of silence, which is how the robot ends up disabled
                     * with nobody touching anything. A serial full GC of a 100 MB heap on this CPU
                     * lands in exactly that range, and it stops every Java thread including the
                     * one answering the DS -- but that is inference from timing, not something any
                     * log actually recorded. This records it.
                     *
                     * Rotated and capped at five 2 MB files, so it cannot become the disk problem
                     * it is here to help diagnose.
                     */
                    jvmArgs.add("-Xlog:gc*,safepoint:file=/home/lvuser/logs/gc.log" +
                            ":time,uptime,level:filecount=5,filesize=2M")
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = true // Change to true to delete files on roboRIO that no
                    // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Set to true to use debug for JNI.
wpi.java.debugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = false

repositories {
    mavenCentral()
}

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    from sourceSets.main.allSource
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

spotbugs {
    ignoreFailures = false
    showStackTraces = true
    showProgress = true
    effort = com.github.spotbugs.snom.Effort.DEFAULT
    reportLevel =  com.github.spotbugs.snom.Confidence.values()[3]
    reportsDir = file("$buildDir/reports/spotbugs")
    //includeFilter = file('spotbugs-include.xml')
    excludeFilter = file('excludeFilter-spotbugs.xml')
}

tasks.spotbugsMain {
    reports.create("html") {
        enabled = true
        outputLocation = file("$buildDir/reports/spotbugs.html")
        setStylesheet("fancy-hist.xsl")
    }
}

//Javadoc Gradle task configuration
javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
    exclude '**/*.md'
    options.setLinks([
        "https://github.wpilib.org/allwpilib/docs/release/java",
        "https://codedocs.revrobotics.com/java",
        "https://api.ctr-electronics.com/phoenix/latest/java",
        "https://api.ctr-electronics.com/phoenix6/latest/java",
        "https://pathplanner.dev/api/java",
        "https://javadoc.doglog.dev",
        "https://shenzhen-robotics-alliance.github.io/maple-sim/javadocs",
        "https://docs.oracle.com/en/java/javase/17/docs/api"
    ])
}

// Create version file
project.compileJava.dependsOn(createVersionFile)
gversion {
    srcDir       = "src/main/java/"
    classPackage = "frc.robot"
    className    = "BuildConstants"
    dateFormat   = "yyyy-MM-dd HH:mm:ss z"
    timeZone     = "America/New_York"
    indent       = "  "
}

// Configure Spotless to use google aosp standards
// Style Guide: https://source.android.com/docs/setup/contribute/code-style#java-style-rules
// Configure Spotless to apply on every build
compileJava.dependsOn spotlessApply
spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude '**/build/**', '**/build-*/**'
        }
        toggleOffOn()
        googleJavaFormat("1.15.0").aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree('.') {
            include '**/*.gradle'
            exclude '**/build/**', '**/build-*/**'
        }
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'xml', {
        target fileTree('.') {
            include '**/*.xml'
            exclude '**/build/**', '**/build-*/**'
        }
        eclipseWtp('xml')
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
    flexmark {
        target fileTree('.') {
            include '**/*.md'
            exclude '**/build/**', '**/build-*/**'
            exclude '.agents/skills/**/SKILL.md'
        }
        flexmark()
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'misc', {
        target fileTree('.') {
            include '**/.gitignore'
            exclude '**/build/**', '**/build-*/**'
        }
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
}
